[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmgmtcli"
version = "0.1.0"
description = "Manage Microsoft Entra Agent ID blueprints, identities, and registrations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "typer>=0.12.3",
  "rich>=13.7.1",
]

[project.scripts]
agentmgmt = "agentmgmtcli.cli:app"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["agentmgmtcli*"]

